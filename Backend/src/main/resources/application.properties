server.port=${PORT:8080}
spring.application.name=roadfix-backend

# Large payload support for hazard photos & work proofs
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-http-form-post-size=25MB
server.tomcat.max-swallow-size=25MB

# MongoDB Database Configuration from .env
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/roadfix_db?serverSelectionTimeoutMS=2500}
spring.data.mongodb.database=${DATABASE_NAME:roadfix_db}

# Logging configuration
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.mongodb.driver=INFO
logging.level.com.roadfix=INFO
