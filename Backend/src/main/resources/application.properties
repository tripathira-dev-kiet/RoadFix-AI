server.port=8080
spring.application.name=roadfix-backend

# Large payload support for photos
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-http-form-post-size=25MB
server.tomcat.max-swallow-size=25MB

# XAMPP MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/roadfix_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fail-safe startup if MySQL is temporarily offline
spring.datasource.hikari.initialization-fail-timeout=3000
