<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RoadFix AI</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .register-box {
            width: 520px;
            max-width: 92%;
            margin: 40px auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }

        .register-box h2 {
            text-align: center;
            color: var(--primary-light);
            margin-bottom: 8px;
            font-size: 24px;
        }

        .register-box .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .alert-box {
            padding: 12px 14px;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 13px;
            display: none;
        }

        .alert-error {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        .alert-success {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-container">
            <div class="logo">RoadFix<span>AI</span></div>
            <span class="logo-tag">Register</span>
        </a>
        <nav id="mainNav"></nav>
    </header>

    <div class="container">
        <div class="register-box">
            <h2>Create New Account</h2>
            <p class="subtitle">Join RoadFix AI to report and track municipal civic issues</p>

            <div id="alertBox" class="alert-box"></div>

            <form onsubmit="handleRegister(event)">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="e.g. Ramesh Chandra" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="e.g. ramesh@gmail.com" required>

                <label for="phone">Phone / Mobile Number</label>
                <input type="tel" id="phone" placeholder="e.g. +91 9876543210" required>

                <label for="role">Register As (Role)</label>
                <select id="role" onchange="toggleDeptField()" required>
                    <option value="CITIZEN">Citizen (Public User)</option>
                    <option value="STAFF">Field Staff / Operations Officer</option>
                    <option value="ADMIN">Municipal Administrator</option>
                </select>

                <div id="deptGroup" style="display: none;">
                    <label for="departmentName">Municipal Department</label>
                    <select id="departmentName">
                        <option value="Roads & Infrastructure">Roads & Infrastructure</option>
                        <option value="Sanitation & Waste">Sanitation & Waste</option>
                        <option value="Electrical & Lighting">Electrical & Lighting</option>
                        <option value="Water Supply & Drainage">Water Supply & Drainage</option>
                    </select>
                </div>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a secure password" minlength="4" required>

                <button type="submit" id="regBtn" class="btn btn-primary btn-block">Create Account</button>
            </form>

            <p style="text-align:center; margin-top:20px; font-size:14px; color:var(--text-muted);">
                Already have an account? <a href="login.html" style="color:var(--primary-light); font-weight:600; text-decoration:none;">Login here</a>
            </p>
        </div>
    </div>

    <footer>
        <div class="copyright">
            © 2026 RoadFix AI | Civic Issue Reporting & Tracking Platform | KIET
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script>
        function toggleDeptField() {
            const role = document.getElementById('role').value;
            const deptGroup = document.getElementById('deptGroup');
            deptGroup.style.display = (role === 'STAFF' || role === 'DEPARTMENT_OFFICER') ? 'block' : 'none';
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            const alertBox = document.getElementById('alertBox');
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const role = document.getElementById('role').value;
            const departmentName = (role === 'STAFF' || role === 'DEPARTMENT_OFFICER') ? document.getElementById('departmentName').value : null;
            const password = document.getElementById('password').value.trim();

            btn.disabled = true;
            btn.innerText = 'Creating account in database...';
            alertBox.style.display = 'none';

            try {
                const response = await RoadFix.register({
                    fullName, email, phone, role, departmentName, password
                });

                if (response.success) {
                    alertBox.className = 'alert-box alert-success';
                    alertBox.innerText = '✅ Account registered successfully in database! Redirecting to login...';
                    alertBox.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1200);
                } else {
                    alertBox.className = 'alert-box alert-error';
                    alertBox.innerText = response.message || 'Registration failed.';
                    alertBox.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = 'Create Account';
                }
            } catch (err) {
                alertBox.className = 'alert-box alert-error';
                alertBox.innerText = 'Error: ' + err.message;
                alertBox.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'Create Account';
            }
        }
    </script>
</body>
</html>
