<header>

    <h2>RoadFix AI</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="report.html">Report Issue</a>
        <a href="track.html">Track</a>
        <a href="login.html">Login</a>
    </nav>

</header>


<div class="container">

    <h2>Create Account</h2>

    <form onsubmit="registerUser(event)">

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>


        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <p id="message"></p>


        <label>Mobile Number</label>
        <input type="tel" id="mobile" placeholder="Enter mobile number" required>


        <label>Password</label>
        <input type="password" id="password" placeholder="Create password" required>


        <label>Address</label>
        <textarea id="address" placeholder="Enter your address" required></textarea>


        <button type="submit">Create Account</button>

    </form>


    <p class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>


<footer>
    <p>© 2026 RoadFix AI | Civic Issue Reporting & Tracking Platform</p>
</footer>


<script>

    function registerUser(event) {

        event.preventDefault();

        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value.toLowerCase();
        let mobile = document.getElementById("mobile").value;
        let password = document.getElementById("password").value;
        let address = document.getElementById("address").value;

        let role = "";

        let staffEmails = [
            "staff1@roadfix.com",
            "staff2@roadfix.com",
            "staff3@roadfix.com"
        ];

        if (email.endsWith("@gmail.com")) {

            role = "citizen";

        }
        else if (staffEmails.includes(email)) {

            role = "staff";

        }
        else if (email == "admin@roadfix.com") {

            role = "admin";

        }
        else {

            document.getElementById("message").innerHTML =
                "Please use an authorized email address.";

            document.getElementById("message").style.color = "red";

            return;
        }


        localStorage.setItem("userName", name);
        localStorage.setItem("userEmail", email);
        localStorage.setItem("userMobile", mobile);
        localStorage.setItem("userPassword", password);
        localStorage.setItem("userAddress", address);
        localStorage.setItem("userRole", role);


        alert("Registration successful!");

        window.location.href = "login.html";
    }

</script>
