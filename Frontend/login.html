<html>
<head>
    <title>Login - RoadFix AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #222;
        }

        header {
            background-color: #12315a;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #ffffff;
            margin: 0;
            font-size: 25px;
        }

        nav a {
            color: #dbeafe;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        nav a:hover {
            color: #8fd3c7;
        }

        .login-box {
            width: 350px;
            margin: 70px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #dbe7f0;
            box-shadow: 0 8px 24px rgba(18, 49, 90, 0.08);
        }

        .login-box h2 {
            text-align: center;
            color: #1769aa;
            margin-bottom: 25px;
        }

        label {
            color: #34495e;
            font-size: 14px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin: 8px 0 15px;
            border: 1px solid #ccd9e5;
            border-radius: 5px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #1769aa;
        }

        button {
            width: 100%;
            padding: 11px;
            background-color: #1769aa;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #12315a;
        }

        a {
            color: #1769aa;
            text-decoration: none;
        }

        a:hover {
            color: #12315a;
        }

        .login-box p {
            color: #667789;
            font-size: 14px;
            line-height: 1.5;
        }

        footer {
            background-color: #12315a;
            color: white;
            text-align: center;
            padding: 15px;

        }

        footer p {
            margin: 0;
            font-size: 13px;
            color: #dbeafe;
        }
    </style>
</head>

<body>

    <header>
        <h2>RoadFix AI</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </header>


    <div class="login-box">

        <h2>Login</h2>

        <form onsubmit="loginUser(event)">

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter Email" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter Password" required>

            <label>Login As</label>
            <select id="role" required>
                <option value="">Select Role</option>
                <option value="citizen">Citizen</option>
                <option value="admin">Admin</option>
                <option value="staff">Field Staff</option>
            </select>

            <button type="submit">Login</button>

        </form>

        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

        <p>
            <a href="index.html">Back to Home</a>
        </p>

    </div>


    <footer>
        <p>© 2026 RoadFix AI | Civic Issue Reporting & Tracking Platform</p>
    </footer>


    <script>
        function loginUser(event) {
            event.preventDefault();

            let role = document.getElementById("role").value;

            if (role == "citizen") {
                window.location.href = "report.html";
            }
            else if (role == "admin") {
                window.location.href = "admin.html";
            }
            else if (role == "staff") {
                window.location.href = "staff.html";
            }
        }
    </script>

</body>
</html>
